<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>音隅 · 聚合音乐</title>
  <meta name="description" content="一处搜遍各大音乐平台，排行榜与懂你的推荐。" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <!-- 手机「添加到桌面」：从桌面图标打开没有地址栏，像 APP 一样（安卓看 manifest，苹果看下面几行） -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="音隅" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./css/style.css" />
  <script>
    // 主题在首帧前应用，避免闪烁
    try {
      const t = JSON.parse(localStorage.getItem('yinyu:v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="var(--accent)"/><path d="M12.5 21.5a2.8 2.8 0 1 1-2.8-2.8c.4 0 .8.1 1.2.3V9.6l10.6-2.2v11.6a2.8 2.8 0 1 1-2.8-2.8c.4 0 .8.1 1.2.3V10.9l-7.4 1.5z" fill="#fff"/></svg>
        <span>音隅</span>
      </a>
      <nav class="nav">
        <a href="#/" data-nav="home"><i data-icon="home"></i>发现音乐</a>
        <a href="#/charts" data-nav="charts"><i data-icon="chart"></i>排行榜</a>
        <a href="#/foryou" data-nav="foryou"><i data-icon="sparkle"></i>为你推荐</a>
      </nav>
      <div class="nav-label">我的音乐</div>
      <nav class="nav">
        <a href="#/likes" data-nav="likes"><i data-icon="heart"></i>我喜欢</a>
        <a href="#/history" data-nav="history"><i data-icon="clock"></i>最近播放</a>
      </nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="themeBtn" type="button" title="切换主题"><i data-icon="moon"></i><span>深色模式</span></button>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <form class="search" id="searchForm" role="search" autocomplete="off">
          <i data-icon="search"></i>
          <input id="searchInput" type="search" placeholder="搜索歌曲、歌手、专辑" aria-label="搜索" />
          <kbd>/</kbd>
        </form>
        <button class="icon-btn mobile-theme" id="themeBtnMobile" type="button" title="切换主题"><i data-icon="moon"></i></button>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <footer class="player" id="player" data-empty="true">
    <div class="player-progress" id="miniProgress"><span></span></div>
    <div class="player-left">
      <button class="player-cover" id="openNow" type="button" title="展开播放页">
        <img alt="" id="pCover" />
        <i data-icon="expand"></i>
      </button>
      <div class="player-meta">
        <div class="player-title" id="pTitle">还没有播放的歌曲</div>
        <div class="player-sub" id="pSub">搜索或从榜单中挑一首吧</div>
      </div>
      <button class="icon-btn like-btn" id="pLike" type="button" title="喜欢"><i data-icon="heart"></i></button>
    </div>
    <div class="player-center">
      <div class="controls">
        <button class="icon-btn sm" id="pMode" type="button" title="列表循环"><i data-icon="repeat"></i></button>
        <button class="icon-btn" id="pPrev" type="button" title="上一首"><i data-icon="prev"></i></button>
        <button class="play-btn" id="pPlay" type="button" title="播放"><i data-icon="play"></i></button>
        <button class="icon-btn" id="pNext" type="button" title="下一首"><i data-icon="next"></i></button>
        <button class="icon-btn sm" id="pLyricBtn" type="button" title="歌词"><i data-icon="lyric"></i></button>
      </div>
      <div class="timeline">
        <span id="pCur">0:00</span>
        <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="播放进度" />
        <span id="pDur">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <span class="badge" id="pKind" hidden></span>
      <button class="icon-btn sm" id="pDeskLyric" type="button" title="桌面歌词 (D)"><i data-icon="desk-lyric"></i></button>
      <div class="volume">
        <button class="icon-btn sm" id="pMute" type="button" title="静音"><i data-icon="volume"></i></button>
        <input type="range" id="pVol" min="0" max="100" value="80" aria-label="音量" />
      </div>
      <button class="icon-btn" id="pQueueBtn" type="button" title="播放列表"><i data-icon="queue"></i></button>
    </div>
  </footer>

  <section class="now" id="now" hidden aria-label="正在播放">
    <div class="now-bg" id="nowBg"></div>
    <button class="icon-btn now-close" id="nowClose" type="button" title="收起 (Esc)"><i data-icon="down"></i></button>
    <div class="now-tabs" id="nowTabs" role="tablist" aria-label="播放页视图">
      <button type="button" role="tab" data-pane="art">歌曲</button>
      <button type="button" role="tab" data-pane="lyric">歌词</button>
    </div>
    <div class="now-inner">
      <div class="now-art">
        <img id="nowCover" alt="" />
        <div class="now-text">
          <div class="now-title-row">
            <div class="now-title-text">
              <h2 id="nowTitle"></h2>
              <p id="nowSub"></p>
            </div>
            <button class="icon-btn like-btn now-like" id="nowLike" type="button" title="喜欢"><i data-icon="heart"></i></button>
          </div>
          <p class="now-line" id="nowLine"></p>
          <div class="now-links" id="nowLinks"></div>
        </div>
      </div>
      <div class="lyrics" id="lyrics"><div class="lyrics-inner" id="lyricsInner"></div></div>
    </div>
  </section>

  <aside class="queue" id="queue" hidden aria-label="播放列表">
    <header>
      <h3>播放列表 <small id="queueCount"></small></h3>
      <button class="text-btn" id="queueClear" type="button">清空</button>
      <button class="icon-btn sm" id="queueClose" type="button" title="关闭"><i data-icon="close"></i></button>
    </header>
    <ol id="queueList"></ol>
  </aside>

  <nav class="tabbar">
    <a href="#/" data-nav="home"><i data-icon="home"></i>发现</a>
    <a href="#/charts" data-nav="charts"><i data-icon="chart"></i>榜单</a>
    <a href="#/foryou" data-nav="foryou"><i data-icon="sparkle"></i>推荐</a>
    <a href="#/likes" data-nav="likes"><i data-icon="heart"></i>我的</a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <audio id="audio" preload="auto"></audio>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
