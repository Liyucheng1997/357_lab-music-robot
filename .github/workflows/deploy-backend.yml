name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: backend
      url: https://music.liyucheng.me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.MUSIC_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MUSIC_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 服务器端为受限钥匙，只会执行 /usr/local/bin/deploy-music
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ubuntu@151.80.60.57
